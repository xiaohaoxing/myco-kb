# MyCo-KB 插件自带补丁层（bundle 自声明）
# 由 package.json 的 dsh.bundle.patch 指向；profile 通过 dsh.profile.bundles 装载本包时，
# 本文件即该包的 entry 声明（id+name 都必须有——loader 用 name import，缺则崩溃）。
# 用户可在 profile/cordis.patch.yml 里以同名 id 覆盖 config（patch 叠加语义）。
- insert:
    - id: '@dsh/myco-kb'
      name: '@dsh/myco-kb'
      config:
        # 定时维护间隔（小时）：索引重建 → 生命周期扫描 → 云端 git 同步
        maintenanceIntervalHours: 6

        # v0.4 按任务动态装配（agent 作用域，opt-in；取消注释并设 auto:true 生效）
        # auto: 订阅 agent/created 后，在 agent 作用域内用「最近一次装配」注入 scoped 检索工具。
        # 注意：agent 创建时目标往往未就绪，故此处复用最近一次 myco assemble 的 lockfile；
        # 真正「agent start 读目标自动装配」需真实 agent 循环核验（见 docs/v0.4-dynamic-assembly.md §7）。
        # assemble:
        #   auto: true

        # 聚合遥测（opt-in）：用户勾选「统计共享」才上报，仅匿名聚合统计。
        # provider=posthog：按 PostHog 单事件格式 POST {api_key,event,distinct_id,properties,timestamp}。
        # url = PostHog 云端摄入端点（US=us.i.posthog.com，EU=eu.i.posthog.com，自建按你的域名）+ /i/v0/e/。
        # apiKey = PostHog 项目 token（phc_...，公开的摄入 key）——不内置默认值，
        #          用环境变量 POSTHOG_API_KEY 注入（telemetry.apiKey 缺省时回退）；未配置则不发送。
        telemetry:
          provider: posthog
          url: https://us.i.posthog.com/i/v0/e/
          intervalHours: 24

        # 设置页「相关链接」区（三个链接；留空则该项不显示）
        links:
          source: https://github.com/xiaohaoxing/myco-kb
          docs: https://xiaohaoxing.github.io/myco-kb/
          site: https://github.com/xiaohaoxing/myco-kb

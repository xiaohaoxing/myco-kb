<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MyCo-KB 菌丝知识网络 Logo">
  <defs>
    <linearGradient id="myco-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="myco-fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#99f6e4"/>
    </linearGradient>
  </defs>
  <!-- 菌丝网络底 -->
  <circle cx="32" cy="32" r="30" fill="url(#myco-bg)"/>
  <!-- 连接线（传播边） -->
  <g stroke="#a7f3d0" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="20" x2="20" y2="34"/>
    <line x1="32" y1="20" x2="44" y2="34"/>
    <line x1="20" y1="34" x2="32" y2="44"/>
    <line x1="44" y1="34" x2="32" y2="44"/>
    <line x1="32" y1="44" x2="32" y2="20" opacity="0.35"/>
  </g>
  <!-- 知识节点 -->
  <circle cx="32" cy="20" r="5.6" fill="url(#myco-fg)"/>
  <circle cx="20" cy="34" r="4.2" fill="#ccfbf1"/>
  <circle cx="44" cy="34" r="4.2" fill="#ccfbf1"/>
  <circle cx="32" cy="44" r="3.6" fill="#a7f3d0"/>
  <!-- 中心亮点 -->
  <circle cx="32" cy="20" r="2.2" fill="#134e4a"/>
</svg>
